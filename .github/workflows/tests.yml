name: PR checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Supersede in-flight runs for a branch being iterated on, but let pushes to
# main finish so every merged commit keeps a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint Python
        run: python -m ruff check .
      # Gate every production module, including the two entry points. main.py
      # and register.py sit outside src/ and were measured by nothing, so the
      # floor could not see that register.py had no tests at all. See
      # docs/coverage-gaps.md for how the scope and the floor were chosen.
      - name: Test Python with coverage
        run: python -m pytest -q --cov=src --cov=scripts --cov=main --cov=register --cov-branch --cov-report=term-missing --cov-fail-under=97

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      # Typecheck scope lives in mypy.ini; there are no error suppressions.
      - name: Typecheck Python
        run: python -m mypy

  worker:
    name: Worker and local D1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install Worker dependencies
        run: npm ci
        working-directory: worker
      - name: Check Worker syntax
        run: node --check src/index.js
        working-directory: worker
      - name: Test Worker and local D1
        run: npm test
        working-directory: worker
