; Typecheck every production module, with no per-module error suppressions:
; every error code is enforced in every module, so any new category of mistake
; fails CI. Where discord.py's annotations and this bot's runtime disagree, the
; code narrows or widens explicitly at the call site rather than switching a
; code off for a whole module.

[mypy]
python_version = 3.12
files = main.py, register.py, src, scripts
warn_redundant_casts = True
no_implicit_optional = True
warn_unused_configs = True
