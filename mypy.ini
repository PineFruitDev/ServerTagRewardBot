; Typecheck every production module. The per-module sections below are a
; baseline, not a blanket exemption: each one disables a single error code in a
; single module, so every other error code stays enforced everywhere and any
; new category of mistake fails CI.
;
; All baselined errors come from discord.py's own annotations rather than from
; runtime defects: its HTTP layer returns raw JSON payloads annotated as model
; objects, and Interaction.guild is Optional even on commands marked
; guild_only. Removing these needs product changes, which belong in their own
; change rather than a test/CI pass.

[mypy]
python_version = 3.12
files = main.py, register.py, src, scripts
warn_redundant_casts = True
no_implicit_optional = True
warn_unused_configs = True

; http.get_members/get_user return member and user payload dicts; the stubs
; annotate them as Member/User models, so dict access looks ill-typed.
[mypy-src.services.tag_sync]
disable_error_code = arg-type

; interaction.user is Member | User; inside a guild_only command it is a Member.
[mypy-src.commands.repped]
disable_error_code = arg-type

; CommandTree.on_error is assigned a bound handler, which mypy reads as
; overwriting a method.
[mypy-src.core.bot]
disable_error_code = method-assign

; View.children is list[Item[...]]; this view only ever holds Buttons.
; interaction.guild is Optional, but guard() rejects DMs before _configure.
[mypy-src.commands.setup]
disable_error_code = attr-defined, union-attr

; on_ready caches its synced flag on the client via getattr/setattr.
[mypy-main]
disable_error_code = attr-defined
